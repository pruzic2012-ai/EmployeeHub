
<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Edit Employee</h2>

    <a
      routerLink="/employees"
      class="btn btn-secondary">
      Back to Employees
    </a>
  </div>

  <div class="card">
    <div class="card-body">

      <div class="mb-3">
        <label class="form-label">First Name</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="firstName">
      </div>

      <div class="mb-3">
        <label class="form-label">Last Name</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="lastName">
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="email">
      </div>

      <div class="mb-3">
        <label class="form-label">Department</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="department">
      </div>

      <div class="mb-3">
        <label class="form-label">Salary</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="salary">
      </div>

      <button
        type="button"
        class="btn btn-primary"
        (click)="saveChanges()">
        Save Changes
      </button>

    </div>
  </div>

</div>
