<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Add Employee</h2>

    <a routerLink="/employees" class="btn btn-secondary">
      Back to Employees
    </a>
  </div>

  <div class="card">    
    <div class="card-body">
        @if (successMessage()) {
            <div class="alert alert-success" role="alert">
                {{ successMessage() }}
            </div>
        }

      <div class="row">

        <div class="col-md-6 mb-3">
          <label for="firstName" class="form-label">
            First Name
          </label>

          <input
            id="firstName"
            type="text"
            class="form-control"
            placeholder="Enter first name"
            [(ngModel)]="firstName">
        </div>

        <div class="col-md-6 mb-3">
          <label for="lastName" class="form-label">
            Last Name
          </label>

          <input
            id="lastName"
            type="text"
            class="form-control"
            placeholder="Enter last name"
            [(ngModel)]="lastName">
        </div>

        <div class="col-md-6 mb-3">
          <label for="email" class="form-label">
            Email
          </label>

          <input
            id="email"
            type="email"
            class="form-control"
            placeholder="Enter email"
            [(ngModel)]="email">
        </div>

        <div class="col-md-6 mb-3">
          <label for="department" class="form-label">
            Department
          </label>

          <input
            id="department"
            type="text"
            class="form-control"
            placeholder="Enter department"
            [(ngModel)]="department">
        </div>

        <div class="col-md-6 mb-3">
          <label for="salary" class="form-label">
            Salary
          </label>

          <input
            id="salary"
            type="number"
            class="form-control"
            placeholder="Enter salary"
            [(ngModel)]="salary">
        </div>

      </div>

      <button type="button" class="btn btn-primary" (click)="createEmployee()">
        Add Employee
      </button>

    </div>
  </div>

</div>
